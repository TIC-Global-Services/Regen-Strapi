services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/app/public/uploads

volumes:
  strapi_uploads:
